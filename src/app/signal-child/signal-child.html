<div class="bordered">
  <h4>Child Component</h4>

  <!-- Service-based Shared State -->
  <p>Shared state from service: <strong>{{ sharedMessage() }}</strong></p>
  <button type="button" (click)="clearSharedState()">Clear Shared State</button>

  <hr />

  <!-- Component Communication APIs -->
  <p>Received counter from parent via input(): <strong>{{ parentCounter() }}</strong></p>

  <button
    type="button"
    data-testid="notify-parent"
    (click)="notifyParent()"
  >Emit output() to Parent</button>

  <p>Two-way model() value: <strong>{{ childValue() }}</strong></p>
  <button 
    type="button"
    data-testid="update-model"
    (click)="updateModel()"
  >Change model() from Child</button>
</div>
