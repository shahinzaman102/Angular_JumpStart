<router-outlet />

<!--
<router-outlet /> acts as a dynamic placeholder where Angular inserts whatever component 
matches the user's current URL route.

Instead of reloading the full page, the application moves forward by swapping components in 
and out of this single slot as the user navigates.

How navigation flows from here:
- URL updates (e.g., user clicks a link to /dashboard).
- Router checks rules defined in your app.routes.ts file.
- Component renders inside <router-outlet /> without refreshing the page.
-->
