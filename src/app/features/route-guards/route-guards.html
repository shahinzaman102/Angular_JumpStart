<div class="playground-container">
  <h2>Route Guards Interactive Playground</h2>

  <!-- State Toggles -->
  <div class="toggles-card">
    <h3>1. Toggle Guard Conditions in LocalStorage</h3>
    <label>
      <input type="checkbox" [checked]="isLoggedIn()" (change)="toggleLogin()" /> 
      Logged In (Required for <code>CanActivate</code>)
    </label><br />

    <label>
      <input type="checkbox" [checked]="isAdmin()" (change)="toggleAdmin()" /> 
      Admin Role (Required for <code>CanActivateChild</code>)
    </label><br />

    <label>
      <input type="checkbox" [checked]="betaFeature()" (change)="toggleBeta()" /> 
      Enable Beta Flag (Required for <code>CanMatch</code> variant A)
    </label><br />

    <label class="warning-label">
      <input type="checkbox" [checked]="dirtyForm()" (change)="dirtyForm.set(!dirtyForm())" /> 
      Form Has Unsaved Changes (Triggers <code>CanDeactivate</code> when leaving)
    </label>
  </div>

  <!-- Route Links -->
  <div class="navigation-card">
    <h3>2. Try Navigating</h3>
    <a routerLink="/route-guards/child-a">Child Route A</a>
    <a routerLink="/route-guards/child-b">Child Route B</a>
    <a routerLink="/route-guards/feature">Feature Route (CanMatch Test)</a>
    <a routerLink="/">Go Back Home</a>
  </div>

  <hr />

  <!-- Sub-route render container -->
  <router-outlet></router-outlet>
</div>
